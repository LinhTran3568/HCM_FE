<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#10B981" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HCM202 - Tư tưởng Hồ Chí Minh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: #10B981;
        --color-primary-hover: #059669;
        --color-primary-active: #047857;
        --color-primary-soft: rgba(16, 185, 129, 0.12);
        --color-primary-dark: #064E3B;
        --color-primary-gradient: linear-gradient(135deg, #10B981 0%, #059669 100%);
        --color-accent-gradient: linear-gradient(135deg, #3B82F6 0%, #10B981 100%);

        --bg-base: #F8FAFC;
        --bg-surface: #FFFFFF;
        --bg-elevated: #FFFFFF;
        --bg-inset: #F1F5F9;
        --bg-hover: #F1F5F9;
        --bg-page: #F8FAFC;
        --bg-glass: rgba(255, 255, 255, 0.85);

        --border-light: #E2E8F0;
        --border-default: #CBD5E1;
        --border-strong: #94A3B8;
        --border-focus: #10B981;

        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --text-inverse: #FFFFFF;
        --text-link: #10B981;

        --color-success: #10B981;
        --color-success-soft: #D1FAE5;
        --color-success-text: #065F46;
        --color-warning: #F59E0B;
        --color-warning-soft: #FEF3C7;
        --color-warning-text: #92400E;
        --color-danger: #EF4444;
        --color-danger-soft: #FEE2E2;
        --color-danger-text: #991B1B;
        --color-info: #3B82F6;
        --color-info-soft: #DBEAFE;

        --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
        --shadow-md: 0 6px 16px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);
        --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12), 0 4px 8px rgba(15, 23, 42, 0.04);
        --shadow-glow: 0 0 20px rgba(16, 185, 129, 0.25);

        --radius-xs: 6px;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --radius-full: 9999px;

        --space-0: 0;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-16: 64px;

        --font-sans: "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: monospace;

        --text-xs: 0.75rem;
        --text-sm: 0.875rem;
        --text-base: 1rem;
        --text-lg: 1.125rem;
        --text-xl: 1.25rem;
        --text-2xl: 1.5rem;
        --text-3xl: 1.875rem;
        --text-display: 2.25rem;

        --leading-tight: 1.25;
        --leading-normal: 1.5;
        --leading-relaxed: 1.65;

        --weight-normal: 400;
        --weight-medium: 500;
        --weight-semibold: 600;
        --weight-bold: 700;

        --content-max-width: 1200px;
        --sidebar-width: 250px;
        --header-height: 60px;
        --nav-height: 60px;
        --option-min-height: 52px;

        --transition-fast: 120ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        --font-scale: 1;
      }

      :root[data-theme="dark"] {
        --color-primary: #34D399;
        --color-primary-hover: #10B981;
        --color-primary-active: #059669;
        --color-primary-soft: rgba(52, 211, 153, 0.15);
        --color-primary-dark: #6EE7B7;
        --color-primary-gradient: linear-gradient(135deg, #34D399 0%, #059669 100%);
        --color-accent-gradient: linear-gradient(135deg, #60A5FA 0%, #34D399 100%);

        --bg-base: #0B0F17;
        --bg-surface: #131B2E;
        --bg-elevated: #1E293B;
        --bg-inset: #0F172A;
        --bg-hover: #1E293B;
        --bg-page: #0B0F17;
        --bg-glass: rgba(19, 27, 46, 0.85);

        --border-light: #1E293B;
        --border-default: #334155;
        --border-strong: #475569;

        --text-primary: #F8FAFC;
        --text-secondary: #94A3B8;
        --text-muted: #64748B;
        --text-inverse: #0B0F17;

        --color-success: #34D399;
        --color-success-soft: rgba(52, 211, 153, 0.15);
        --color-success-text: #A7F3D0;
        --color-warning: #FBBF24;
        --color-warning-soft: rgba(251, 191, 36, 0.15);
        --color-warning-text: #FDE68A;
        --color-danger: #F87171;
        --color-danger-soft: rgba(248, 113, 113, 0.15);
        --color-danger-text: #FCA5A5;
        --color-info: #60A5FA;
        --color-info-soft: rgba(96, 165, 250, 0.15);

        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.6);
        --shadow-glow: 0 0 24px rgba(52, 211, 153, 0.3);
      }

      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { font-size: calc(16px * var(--font-scale)); -webkit-text-size-adjust: 100%; }
      body {
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        color: var(--text-primary);
        background: var(--bg-base);
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      #root { min-height: 100dvh; display: flex; flexDirection: column; }
      button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; line-height: inherit; }
      input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
      button:focus:not(:focus-visible), input:focus:not(:focus-visible) { outline: none; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 250ms ease-out forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
